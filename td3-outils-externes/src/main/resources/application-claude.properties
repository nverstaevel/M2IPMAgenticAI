# Profil « claude » : API Claude via la couche de compatibilité OpenAI d'Anthropic (starter OpenAI déjà présent).
# Clé API (Claude Console) dans la variable d'environnement ANTHROPIC_API_KEY, JAMAIS dans Git.
# Lancer avec --spring.profiles.active=claude ; changer de modèle : -Dspring.ai.openai.chat.model=...
spring.ai.model.chat=openai
spring.ai.openai.base-url=https://api.anthropic.com
spring.ai.openai.chat.completions-path=/v1/chat/completions
spring.ai.openai.api-key=${ANTHROPIC_API_KEY:cle-non-renseignee}
spring.ai.openai.chat.model=claude-haiku-5-5
# Pas de « temperature » : les modèles Claude récents refusent (400) une valeur inférieure à 1.
