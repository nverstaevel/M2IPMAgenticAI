name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        td: [td1-clinique, td2-chat, td3-outils-externes, td4-agent-react, td5-agents-roles, td6-mise-a-l-epreuve]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Build et tests
        run: |
          if [ -f "${{ matrix.td }}/pom.xml" ]; then mvn -B -f "${{ matrix.td }}/pom.xml" verify; else echo "dossier absent"; fi
